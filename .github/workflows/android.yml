
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Inspect project and Android SDK metadata
        run: |
          pwd
          ls -la
          find . \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \) -print
          echo "Android SDK: $ANDROID_HOME"
          find "$ANDROID_HOME" -name 'package.xml' -type f -print0 |
            xargs -0 grep -n -B 2 -A 2 '<api-level>37\.1</api-level>' || true

      - name: Build APK
        run: |
          WRAPPER="$(find . -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: No Gradle wrapper found in repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$WRAPPER")"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tinder-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 7
          
