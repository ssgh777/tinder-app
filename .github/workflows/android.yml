name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::No gradlew file found in the repository."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          chmod +x "$WRAPPER"

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle wrapper: $WRAPPER"
          echo "Project directory: $PROJECT_DIR"

      - name: Switch to Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Show build configuration
        shell: bash
        run: |
          echo "Java version:"
          java -version

          echo "Gradle configuration:"
          grep -n "distributionUrl" \
            "${{ steps.gradle.outputs.project_dir }}/gradle/wrapper/gradle-wrapper.properties" \
            || true

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          set -o pipefail
          "${GITHUB_WORKSPACE}/${{ steps.gradle.outputs.wrapper }}" \
            --no-daemon assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        if: success()
        shell: bash
        run: |
          APK="$(find "${{ steps.gradle.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::Build succeeded but no APK was found."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tinder-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Report build failure
        if: failure()
        shell: bash
        run: |
          echo "Build failed. Check the first failing step above."
