name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --licenses </dev/null || true

      - name: Locate Gradle wrapper
        id: gradle
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::No Gradle wrapper found."
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          chmod +x "$WRAPPER"
          PROJECT_DIR="$(dirname "$WRAPPER")"

          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Switch to Java 8 for legacy Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          "${GITHUB_WORKSPACE}/${{ steps.gradle.outputs.wrapper }}" \
            --no-daemon assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        if: success()
        shell: bash
        run: |
          APK="$(find "${{ steps.gradle.outputs.project_dir }}" \
            -type f -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::No APK found after the build."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tinder-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
